services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kali_osint
      POSTGRES_USER: osint_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint_agent -d kali_osint"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme-neo4j-password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  tor:
    image: dperson/torproxy:latest
    environment:
      PASSWORD: ${TOR_CONTROL_PASSWORD:-changeme-tor-password}
    ports:
      - "9050:9050"
      - "9051:9051"
    volumes:
      - tor_data:/var/lib/tor

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  tor_data:
