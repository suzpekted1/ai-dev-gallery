[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kali-osint-agent"
version = "0.1.0"
description = "LangGraph-powered OSINT agent for Kali Linux with multi-LLM support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-telegram-bot>=21.0",
    "websockets>=13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "neo4j>=5.25.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    "redis>=5.2.0",
    "shodan>=1.31.0",
    "censys>=2.2.0",
    "httpx[socks]>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.49.0",
    "lxml>=5.0.0",
    "PySocks>=1.7.1",
    "stem>=1.8.2",
    "aiohttp[speedups]>=3.11.0",
    "aiohttp-socks>=0.9.0",
    "fake-useragent>=1.5.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.0",
    "rich>=13.9.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[project.scripts]
kali-agent = "src.main:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
